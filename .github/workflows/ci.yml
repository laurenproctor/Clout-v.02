name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Use `npm install` (not `npm ci`): @resvg/resvg-js pulls optional
      # @napi-rs/wasm-runtime → @emnapi/* whose Linux resolution isn't captured
      # by a lockfile generated on macOS, so strict `npm ci` rejects it. The
      # lenient install resolves correctly on the runner's platform.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Hard gates — these block the merge. Both are green as of this commit.
      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Advisory only: the react-hooks/* backlog (set-state-in-effect,
      # exhaustive-deps, compiler diagnostics) is intentionally deferred and
      # still reports errors. Surface lint output without blocking merges until
      # that tier is cleaned, then drop `continue-on-error` to make it a gate.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
